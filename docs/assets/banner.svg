<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect x="40" y="30" width="500" height="280" rx="10" fill="#11161d" stroke="#2a3340" stroke-width="1.5"/>

  <!-- asks, worst at the top -->
  <g font-family="monospace" font-size="19">
    <rect x="60" y="48" width="330" height="26" fill="#3a2328"/>
    <text x="410" y="68" fill="#f26d6d">2.80</text>
    <text x="470" y="68" fill="#8b949e">60</text>
    <rect x="60" y="82" width="250" height="26" fill="#3a2328"/>
    <text x="410" y="102" fill="#f26d6d">2.60</text>
    <text x="470" y="102" fill="#8b949e">45</text>
    <rect x="60" y="116" width="180" height="26" fill="#3a2328"/>
    <text x="410" y="136" fill="#f26d6d">2.55</text>
    <text x="470" y="136" fill="#8b949e">12</text>
  </g>

  <!-- the spread -->
  <line x1="60" y1="160" x2="520" y2="160" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="410" y="154" font-family="monospace" font-size="15" fill="#e3b341">spread</text>

  <!-- bids, best at the top -->
  <g font-family="monospace" font-size="19">
    <rect x="60" y="178" width="210" height="26" fill="#17301f"/>
    <text x="410" y="198" fill="#3fb950">2.20</text>
    <text x="470" y="198" fill="#8b949e">40</text>
    <rect x="60" y="212" width="290" height="26" fill="#17301f"/>
    <text x="410" y="232" fill="#3fb950">2.00</text>
    <text x="470" y="232" fill="#8b949e">50</text>
    <rect x="60" y="246" width="150" height="26" fill="#17301f"/>
    <text x="410" y="266" fill="#3fb950">1.90</text>
    <text x="470" y="266" fill="#8b949e">25</text>
  </g>

  <text x="610" y="150" font-family="Georgia, serif" font-size="76" fill="#e6edf3">chainbook</text>
  <text x="614" y="196" font-family="Georgia, serif" font-size="26" fill="#8b949e">a limit order book that lives on-chain</text>
  <text x="614" y="238" font-family="monospace" font-size="19" fill="#5b6672">escrowed funds · price-time priority · partial fills</text>
</svg>
